  # Tutorial 1
  1882: "{SMALLFONT}{COLOUR BLACK}Buszjáratot fogunk indítani egy városon belül, első lépésként válasszunk egy várost..."
  1883: "{SMALLFONT}{COLOUR BLACK}Mozgasd az egeret a jobb gombot nyomva tartva a nézet görgetéséhez..."
  1884: "{SMALLFONT}{COLOUR BLACK}Boulder Bay a legnagyobb város, itt lesz a legtöbb utas. Nagyíts rá az egérgörgővel vagy a nagyítás ikonra kattintva..."
  1885: "{SMALLFONT}{COLOUR BLACK}Minden közúti építkezés az útépítés ablakban történik..."
  1886: "{SMALLFONT}{COLOUR BLACK}Nincs szükségünk új utakra a városban, csak buszmegállókra..."
  1887: "{SMALLFONT}{COLOUR BLACK}A buszunk a város egyik feléből a másikba fog közlekedni..."
  1888: "{SMALLFONT}{COLOUR BLACK}A kékkel jelölt rész az állomás vonzáskörzete. Minél több épület van benne, annál több az utas..."
  1889: "{SMALLFONT}{COLOUR BLACK}Ellenőrizd, hogy a megálló elfogad-e utasokat az adott helyen, különben nem tudsz pénzt keresni. Figyeld az építési ablak alján a „Vonáskörzet” szöveget..."
  1890: "{SMALLFONT}{COLOUR BLACK}Ha elégedett vagy a hellyel, kattints a bal gombbal az építéshez..."
  1891: "{SMALLFONT}{COLOUR BLACK}Építsük fel a második megállót a város túlsó felén..."
  1892: "{SMALLFONT}{COLOUR BLACK}Most vásárolnunk kell egy buszt..."
  1893: "{SMALLFONT}{COLOUR BLACK}Kétféle busz közül választhatunk. Válasszuk az újabb típust, amely több utast tud szállítani..."
  1894: "{SMALLFONT}{COLOUR BLACK}Mozgasd az egérmutatót egy útra, hogy a busz a kívánt helyen legyen, majd kattints a bal egérgombbal a elhelyezéséhez..."
  1895: "{SMALLFONT}{COLOUR BLACK}Mielőtt elindítjuk a buszt, meg kell adnunk, hová menjen. Válaszd a járműablakban az útvonal részletei fület..."
  1896: "{SMALLFONT}{COLOUR BLACK}Az útvonal beállításához egyszerűen kattints az állomásokra a nézetben..."
  1897: "{SMALLFONT}{COLOUR BLACK}Most már elindíthatjuk a buszt..."
  1898: "{SMALLFONT}{COLOUR BLACK}Nézzük, ahogy felveszi az első utasait..."

  # Tutorial 2
  1899: "{SMALLFONT}{COLOUR BLACK}Buszjáratot fogunk létrehozni az utasok Boulder Bay és Breakers Bridge közötti szállítására. Mivel nincs út a két település között, építenünk kell egyet..."
  1900: "{SMALLFONT}{COLOUR BLACK}Válaszd ki az új útszakasz irányát, majd kattints a nézetben az építés megkezdéséhez..."
  1901: "{SMALLFONT}{COLOUR BLACK}Az „Építés” ikonra kattintva további, azonos típusú útszakaszokkal bővítheted..."
  1902: "{SMALLFONT}{COLOUR BLACK}Mielőtt folytatjuk, mutatok egy gyorsabb módszert az útépítés megkezdésére..."
  1903: "{SMALLFONT}{COLOUR BLACK}Egyszerűen kattints a jobb egérgombbal annak az útnak a végére, amelyet meg szeretnél hosszabbítani..."
  1904: "{SMALLFONT}{COLOUR BLACK}Itt balra kell kanyarodnunk, ezért válassz egy balra kanyarodó útszakaszt..."
  1905: "{SMALLFONT}{COLOUR BLACK}Most pedig folytassuk az építést egyenes útszakasszal..."
  1906: "{SMALLFONT}{COLOUR BLACK}Az út elkészült, most következnek az állomások..."
  1907: "{SMALLFONT}{COLOUR BLACK}Végül vásárolunk egy buszt, és elindítjuk..."
  1908: "{SMALLFONT}{COLOUR BLACK}Ez meglehetősen forgalmas útvonal lehet, ezért veszünk egy második buszt is..."
  1909: "{SMALLFONT}{COLOUR BLACK}Ha gyorsan szeretnéd átmásolni Busz 1 teljes útvonalát Busz 2-re, egyszerűen kattints a Busz 1-nél az „utasításlista vége” szövegre..."

  # Tutorial 3
  1910: "{SMALLFONT}{COLOUR BLACK}Építsünk vasúti személyszállító járatot a két legnagyobb város közé..."
  1911: "{SMALLFONT}{COLOUR BLACK}Vasútállomás csak egyenes vágányra építhető és elég hosszúnak kell lennie a vonathoz..."
  1912: "{SMALLFONT}{COLOUR BLACK}Most építsük fel az állomásokat..."
  1913: "{SMALLFONT}{COLOUR BLACK}Most jöhet a vonat. Kell egy mozdony és vagonok az utasoknak..."
  1914: "{SMALLFONT}{COLOUR BLACK}Mivel a pálya egy egyszerű vonal, nem kell útvonalat beállítani - csak indítsd el..."
  1915: "{SMALLFONT}{COLOUR BLACK}Bővítsük a pályát egy elágazással a harmadik város felé. Jobb klikk a vágányra az építéshez..."
  1916: "{SMALLFONT}{COLOUR BLACK}Mivel a hálózat már bonyolultabb, meg kell adnunk az útvonalat..."
  1917: "{SMALLFONT}{COLOUR BLACK}Hozzádhatnánk egy második vonatot is, de előbb jelzőket kell építeni az ütközések elkerülésére..."
  1918: "{SMALLFONT}{COLOUR BLACK}A jelzők blokkokra osztják a pályát, egy blokkban egyszerre csak egy vonat lehet..."

